[package]
name = "experiments"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cable_test"
path = "src/cable_test.rs"

[[bin]]
name = "pitch_test"
path = "src/pitch_test.rs"

[[bin]]
name = "stem_test"
path = "src/stem_test.rs"

[[bin]]
name = "stem_pitch_test"
path = "src/stem_pitch_test.rs"

[[bin]]
name = "routing_test"
path = "src/routing_test.rs"

[dependencies]
ctrlc = "3"
soundtouch = "0.5"
rubberband = "0.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "cuda", "api-27"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem",
]
