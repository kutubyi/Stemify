[package]
name = "stemify"
version = "0.1.0"
description = "Live key transposing and stem separation for Spotify"
authors = ["kutubyi"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
# The `_lib` suffix avoids clashing with the bin name; only an issue on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "stemify_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../../crates/engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"

[dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Dwm"]
